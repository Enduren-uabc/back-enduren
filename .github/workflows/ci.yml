name: Backend CI

on:
  push:
    branches: [master, develop, dev]
  pull_request:
    branches: [master]

jobs:
  tests:
    name: Unit tests (non-blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Existing non-blocking behavior; addressed separately by CI reliability work.
      - run: pnpm test:cov || true

      # SonarQube Server scanning is temporarily suspended by maintainer decision.
      # Re-enable only with a verified endpoint and a newly issued GitHub secret.
      # The independent SonarCloud integration is managed outside this workflow.

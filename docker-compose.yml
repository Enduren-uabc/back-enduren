name: endure

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set in back-enduren/.env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in back-enduren/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in back-enduren/.env}
    ports:
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - endure_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - endure_network

  frontend:
    build:
      context: ../Endure-Front-end
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../Endure-Front-end/.env
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    develop:
      watch:
        - action: sync
          path: ../Endure-Front-end
          target: /app
          ignore:
            - node_modules/
            - .expo/
            - dist/
            - build/
            - .next/
            - out/
            - '*.log'
        - action: rebuild
          path: ../Endure-Front-end/package.json
        - action: rebuild
          path: ../Endure-Front-end/package-lock.json
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - endure_network

volumes:
  db_data:

networks:
  endure_network:
    driver: bridge

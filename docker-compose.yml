name: endure

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set in back-enduren/.env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in back-enduren/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in back-enduren/.env}
    ports:
      - "${DB_PUBLISHED_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - endure_network

volumes:
  db_data:

networks:
  endure_network:
    driver: bridge
